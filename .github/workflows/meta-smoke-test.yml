name: Meta · prova privada Instagram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instagram-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Crear contenidor privat de prova
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/meta_smoke_test.py
