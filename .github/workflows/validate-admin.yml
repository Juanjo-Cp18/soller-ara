name: Validar Administración Sóller Ara

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - "worker/**"
      - ".github/workflows/validate-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validar JavaScript
        run: |
          node --check admin/admin.js
          node --check worker/admin-worker.js
          node --check admin/config.js

      - name: Verificar que no hay secretos en Wrangler
        run: |
          if grep -Eq '^(ADMIN_PASSWORD|SESSION_SECRET|GITHUB_TOKEN)\s*=' worker/wrangler.toml; then
            echo "ERROR: se ha encontrado un secreto escrito en wrangler.toml"
            exit 1
          fi
          echo "OK: no hay secretos escritos en configuración pública"
