name: Validar publicació pròpia Sóller Ara

on:
  push:
    branches:
      - main
    paths:
      - "scripts/add_own_post.py"
      - "scripts/publish_own_social.py"
      - "scripts/wait_publication_ready.py"
      - "scripts/manage_posts.py"
      - ".github/workflows/publish-own-content.yml"
      - ".github/workflows/validate-own-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instal·lar Pillow
        run: python -m pip install pillow

      - name: Validar sintaxi
        run: python -m py_compile scripts/add_own_post.py scripts/publish_own_social.py scripts/wait_publication_ready.py scripts/manage_posts.py

      - name: Generar publicació de prova local
        env:
          PUBLISH_CONFIRMATION: "PUBLICAR"
          POST_TITLE: "Avís de prova tècnica de Sóller Ara"
          POST_BODY: "Aquesta entrada només es crea dins el runner de GitHub per validar el sistema. No es publica ni es guarda al repositori."
          POST_CATEGORY: "alerts"
          POST_LANGUAGE: "ca"
          POST_IMAGE_URL: ""
        run: python scripts/add_own_post.py

      - name: Comprovar targeta i URL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          manual = json.loads(Path("data/manual_posts.json").read_text(encoding="utf-8"))
          post = manual["posts"][-1]
          assert post["source_type"] == "own"
          assert post["url"].startswith("https://juanjo-cp18.github.io/soller-ara/noticies/")
          assert post["media_url"].startswith("https://juanjo-cp18.github.io/soller-ara/assets/generated/")
          image_name = post["media_url"].rsplit("/", 1)[-1]
          image_path = Path("assets/generated") / image_name
          assert image_path.exists(), image_path
          with Image.open(image_path) as image:
              assert image.size == (1080, 1350), image.size
              assert image.format == "JPEG", image.format
          detail_name = post["url"].rsplit("/", 1)[-1]
          assert (Path("noticies") / detail_name).exists()
          print("VALIDACIÓ OK: targeta, URL i pàgina individual correctes")
          PY
