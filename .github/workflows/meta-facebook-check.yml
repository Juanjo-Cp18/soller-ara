name: Meta · prova privada Facebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facebook-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Comprovar permisos de Facebook
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/meta_facebook_check.py
