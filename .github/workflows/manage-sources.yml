name: Sóller Ara · gestionar fonts

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'ID de la font'
        required: true
        type: string
      enabled:
        description: 'Activar o desactivar'
        required: true
        type: boolean
      confirmation:
        description: 'Escriu CONFIRMAR'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "soller-ara-manage-sources"
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Gestionar font
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          SOURCE_ENABLED: ${{ inputs.enabled }}
          SOURCE_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/manage_sources.py

      - name: Regenerar feed amb la configuració nova
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/update_sources.py

      - name: Guardar canvis
        run: |
          if git diff --quiet -- sources.json data/posts.json data/posts.js; then
            echo "No hi ha canvis"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json data/posts.json data/posts.js
          git commit -m "fonts: actualitzar estat i feed"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Deploy web pública després de gestionar fonts
    needs: manage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del main actualitzat
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
