name: Sóller Ara · gestionar fonts

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'ID de la font'
        required: true
        type: string
      enabled:
        description: 'Activar o desactivar'
        required: true
        type: boolean
      confirmation:
        description: 'Escriu CONFIRMAR'
        required: true
        type: string

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Gestionar font
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          SOURCE_ENABLED: ${{ inputs.enabled }}
          SOURCE_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/manage_sources.py

      - name: Guardar canvis
        run: |
          if git diff --quiet -- sources.json; then
            echo "No hi ha canvis"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "fonts: actualitzar estat"
          git pull --rebase origin main
          git push origin HEAD:main
