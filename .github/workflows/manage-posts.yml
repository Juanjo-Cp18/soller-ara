name: Sóller Ara · gestionar publicacions

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acció'
        required: true
        type: choice
        options:
          - hide
          - unhide
          - delete-own
      post_id:
        description: 'ID de la publicació'
        required: true
        type: string
      confirmation:
        description: 'Escriu CONFIRMAR'
        required: true
        type: string

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Gestionar publicació
        env:
          MODERATION_ACTION: ${{ inputs.action }}
          POST_ID: ${{ inputs.post_id }}
          MODERATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/manage_posts.py

      - name: Guardar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moderation.json data/manual_posts.json data/posts.json data/posts.js noticies assets/generated
          if git diff --cached --quiet; then
            echo "No hi ha canvis"
            exit 0
          fi
          git commit -m "moderació: gestionar publicació"
          git pull --rebase origin main
          git push origin HEAD:main
